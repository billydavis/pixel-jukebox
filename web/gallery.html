<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#141a2e">
<title>Saved Art</title>
<style>
:root{
  --bg:oklch(0.22 0.04 270);--panel:oklch(0.28 0.05 270);--edge:oklch(0.15 0.03 270);
  --ink:oklch(0.94 0.015 270);--dim:oklch(0.74 0.04 270);
  --accent:oklch(0.84 0.13 170);--accent-ink:oklch(0.27 0.05 180);
  --held:oklch(0.58 0.2 355);--led:oklch(0.14 0.02 270);
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px 16px 28px}
body.sel{padding-bottom:170px}
main{display:grid;gap:22px;width:100%;max-width:900px;margin:0 auto}
h1{margin:0;font:700 14px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.link{font:12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  padding:14px 0;margin:-14px 0;text-decoration:none}
.link:hover{color:var(--ink)}
h2{margin:0;font-size:24px;line-height:1.15}
.sub{margin:4px 0 0;font:13px/1.3 var(--mono);color:var(--dim)}
.note{margin:0;min-height:1.4em;font:12px/1.4 var(--mono);color:var(--dim)}
.grid{list-style:none;margin:0;padding:0;display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.tile{display:grid;gap:6px;width:100%;padding:6px;border:0;border-radius:0;cursor:pointer;text-align:left;
  color:var(--ink);background:var(--panel);box-shadow:4px 4px 0 var(--edge);font:inherit}
.tile:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--edge)}
.tile[aria-pressed=true]{box-shadow:inset 0 0 0 3px var(--accent)}
.thumb{position:relative;aspect-ratio:1;background:var(--led)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;object-fit:contain}
.now .thumb::after{content:"On panel";position:absolute;left:0;top:0;padding:3px 5px;
  font:700 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
  color:var(--accent-ink);background:var(--accent)}
.tile span{font:12px/1.2 var(--mono);color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.k{font:700 14px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;
  min-height:48px;padding:0 16px;border:0;border-radius:0;cursor:pointer;color:var(--ink);background:var(--panel);
  box-shadow:4px 4px 0 var(--edge);transition:transform 80ms,box-shadow 80ms}
button.k.go{background:var(--accent);color:var(--accent-ink)}
button.k:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--edge)}
button.k:disabled{opacity:.45;cursor:default;transform:none;box-shadow:4px 4px 0 var(--edge)}
:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
#more{justify-self:center}
.rot summary{font:13px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
  cursor:pointer;min-height:44px;display:flex;align-items:center}
.rot .note{margin:4px 0 14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);box-shadow:0 -6px 0 var(--edge);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom))}
.bar>div{max-width:900px;margin:0 auto;display:grid;gap:12px;
  grid-template-columns:1fr 1fr auto;grid-template-areas:"what what what" "show drop shut"}
.bar .what{grid-area:what;min-width:0}
.bar .what b{display:block;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .what small{display:block;font:12px/1.4 var(--mono);color:var(--dim)}
#show{grid-area:show}#drop{grid-area:drop}#shut{grid-area:shut;min-width:48px;padding:0;font-size:20px}
#drop{background:var(--bg)}
@media (min-width:640px){
  .bar>div{grid-template-columns:1fr auto auto auto;grid-template-areas:"what show drop shut";align-items:center}
}
@media (prefers-reduced-motion:reduce){button.k{transition:none}}
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Pixel Jukebox</h1>
    <a class="link" href="/">&larr; Controls</a>
  </div>
  <div>
    <h2>Saved art</h2>
    <p class="sub" id="sum">&nbsp;</p>
  </div>
  <p class="note" id="note" role="status"></p>
  <ul class="grid" id="grid"></ul>
  <button id="more" class="k" hidden>Show more</button>
  <details class="rot" id="danger" hidden>
    <summary>Clear saved art</summary>
    <p class="note">Deletes every saved artwork from the card. Art is saved again as it plays online.</p>
    <button id="clear" class="k">Clear all</button>
  </details>
</main>
<div class="bar" id="bar" hidden>
  <div>
    <div class="what"><b id="bwho">&nbsp;</b><small id="bsub">&nbsp;</small></div>
    <button id="show" class="k go">Show now</button>
    <button id="drop" class="k">Remove</button>
    <button id="shut" class="k" aria-label="Close">&times;</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id),API='/api/v1',PAGE=24;
let total=0,picked=null,playing=0,timer=0;

async function call(method,path){
  const r=await fetch(API+path,{method});
  const body=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(body.error||r.status),{status:r.status});
  return body;
}

function size(n){
  return n>=1<<20?(n/(1<<20)).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
}

function summary(){
  $('sum').textContent=total?total+' artwork'+(total==1?'':'s')+' · most recently played first':' ';
  $('danger').hidden=!total;
}

function tile(a){
  const li=document.createElement('li'),b=document.createElement('button'),
    th=document.createElement('div'),img=document.createElement('img'),cap=document.createElement('span');
  b.className='tile';b.dataset.post=a.postId;b.setAttribute('aria-pressed','false');
  th.className='thumb';
  img.src=API+'/card/art/'+a.postId+'.gif';img.loading='lazy';img.width=64;img.height=64;
  img.alt=a.owner?'Artwork by @'+a.owner:'Artwork '+a.postId;
  cap.textContent=a.owner?'@'+a.owner:'#'+a.postId;
  th.appendChild(img);b.append(th,cap);li.appendChild(b);
  b.onclick=()=>pick(b,a);
  b.classList.toggle('now',a.postId==playing);
  return li;
}

async function load(more){
  const grid=$('grid'),offset=more?grid.children.length:0;
  try{
    const r=await call('GET','/card/art?offset='+offset+'&limit='+PAGE);
    if(!more)grid.textContent='';
    total=r.total;
    r.artworks.forEach(a=>grid.appendChild(tile(a)));
    summary();
    $('more').hidden=grid.children.length>=total;
    if(!total)$('note').textContent=await emptyReason();
  }catch(e){$('note').textContent='Could not read the card. Is the panel on?';}
}

async function emptyReason(){
  try{
    const c=(await call('GET','/card')).card;
    if(!c.present)return 'No card in the panel. Put in a FAT32 card and restart the panel to keep offline copies of the art.';
    if(!c.ready)return 'The card is not usable: '+c.problem+'.';
  }catch(e){}
  return 'Nothing saved yet. Art is saved to the card as it plays.';
}

function pick(b,a){
  if(picked)picked.b.setAttribute('aria-pressed','false');
  picked={b,a};
  b.setAttribute('aria-pressed','true');
  $('bwho').textContent=a.owner?'@'+a.owner:'Unknown artist';
  $('bsub').textContent='Makapix post '+a.postId+' · '+size(a.bytes);
  $('bar').hidden=false;document.body.classList.add('sel');
  $('show').disabled=$('drop').disabled=false;
  $('note').textContent='';
}

function unpick(){
  if(picked)picked.b.setAttribute('aria-pressed','false');
  picked=null;$('bar').hidden=true;document.body.classList.remove('sel');
}

$('shut').onclick=unpick;
addEventListener('keydown',e=>{if(e.key=='Escape')unpick();});
$('more').onclick=()=>load(true);

$('show').onclick=async()=>{
  if(!picked)return;
  try{
    await call('POST','/card/art/'+picked.a.postId+'/show');
    $('bsub').textContent='Showing on the panel next';
    setTimeout(poll,2500);
  }catch(e){
    $('bsub').textContent=e.status==409?'The panel is in sound mode. Switch to Jukebox first.':
      e.status==404?'No longer on the card.':'Could not reach the panel. Try again.';
  }
};

$('drop').onclick=async()=>{
  if(!picked)return;
  const {b,a}=picked;
  $('show').disabled=$('drop').disabled=true;
  try{
    await call('DELETE','/card/art/'+a.postId);
  }catch(e){
    if(e.status!=404){$('bsub').textContent='Could not remove it. Try again.';$('show').disabled=$('drop').disabled=false;return;}
  }
  unpick();
  b.parentElement.remove();
  total--;summary();
  $('note').textContent=(a.owner?'@'+a.owner+"'s":'The')+' artwork was removed from the card.';
  if(!total)$('note').textContent=await emptyReason();
};

let clearArmed=0;
$('clear').onclick=async()=>{
  if(!clearArmed){
    clearArmed=setTimeout(()=>{clearArmed=0;$('clear').textContent='Clear all';},6000);
    $('clear').textContent='Tap again to delete '+total;
    return;
  }
  clearTimeout(clearArmed);clearArmed=0;
  $('clear').disabled=true;$('clear').textContent='Clearing';
  try{
    const r=await call('DELETE','/card/art');
    unpick();$('danger').open=false;
    await load(false);
    $('note').textContent=r.removed+' artwork'+(r.removed==1?' was':'s were')+' deleted. '+$('note').textContent;
  }catch(e){$('note').textContent='Could not clear the card. Try again.';}
  $('clear').disabled=false;$('clear').textContent='Clear all';
};

// Marks the artwork on the panel, when it is one of these.
async function poll(){
  clearTimeout(timer);
  try{
    const st=await fetch(API+'/status').then(r=>r.json());
    playing=st.artwork?st.artwork.postId:0;
    $('grid').querySelectorAll('.tile').forEach(t=>t.classList.toggle('now',t.dataset.post==playing));
  }catch(e){}
  if(!document.hidden)timer=setTimeout(poll,5000);
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});

load(false).then(poll);
</script>
</body>
</html>
