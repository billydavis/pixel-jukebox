; Pixel Jukebox - Waveshare ESP32-S3-RGB-Matrix + RGB-Matrix-P2-64x64

[platformio]
default_envs = waveshare-s3-rgb-matrix

[env:waveshare-s3-rgb-matrix]
platform = espressif32
framework = arduino
; No dedicated board definition exists, so start from the generic S3 one and
; override the memory layout: the module is an ESP32-S3-N32R16 with 32 MB octal
; flash and 16 MB octal PSRAM. Without the opi settings the app crash-loops at
; boot (assert in do_core_init: flash_ret == ESP_OK).
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = opi_opi
board_build.boot = opi
board_build.flash_mode = dout
board_upload.flash_size = 32MB
board_upload.maximum_size = 33554432
board_build.partitions = large_littlefs_32MB.csv
monitor_speed = 115200

; The pages in web/ are compiled into the firmware as strings (src/network/web_assets.h).
; tools/stage_web.py copies them to .pio/embed/ first, because embedding writes to
; the files it embeds and a crash mid-build once left the real ones blank.
; tools/stage_starter_art.py packs the starter art (assets/starter/) into one
; file the same way, read by src/storage/starter_art.cpp.
; tools/keep_elf.py keeps every build's ELF, so tools/decode_crash.py can name
; the functions in a crash record from whichever build crashed.
extra_scripts =
    pre:tools/stage_web.py
    pre:tools/stage_starter_art.py
    post:tools/keep_elf.py
board_build.embed_txtfiles =
    .pio/embed/index.html
    .pio/embed/setup.html
    .pio/embed/setup_check.html
    .pio/embed/setup_done.html
    .pio/embed/setup.css
board_build.embed_files =
    .pio/embed/starter_art.bin

; Pinned to the versions the firmware is tested with, so a fresh download
; cannot change behaviour. Update deliberately.
lib_deps =
    ; The HUB75 display library is in lib/ESP32-HUB75-MatrixPanel-DMA, patched (PATCHES.md).
    adafruit/Adafruit GFX Library@1.12.6
    bblanchon/ArduinoJson@7.4.3
    bitbank2/AnimatedGIF@2.2.3
    knolleary/PubSubClient@2.8

build_flags =
    ; Route Serial to the native USB port. Remove this line if the serial
    ; monitor stays empty (board uses a USB-UART bridge instead).
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

; Diagnostic build: shows white at rising brightness and colour bars at boot.
[env:colour-check]
extends = env:waveshare-s3-rgb-matrix
build_flags =
    ${env:waveshare-s3-rgb-matrix.build_flags}
    -DCOLOUR_CHECK

; Diagnostic build: lists the I2C devices and plays test tones at boot.
[env:speaker-test]
extends = env:waveshare-s3-rgb-matrix
build_flags =
    ${env:waveshare-s3-rgb-matrix.build_flags}
    -DSPEAKER_TEST

; Diagnostic build: shows the level of each microphone at boot for a minute.
[env:mic-test]
extends = env:waveshare-s3-rgb-matrix
build_flags =
    ${env:waveshare-s3-rgb-matrix.build_flags}
    -DMIC_TEST

; Diagnostic build: finds the motion sensor and shows taps and knocks for two minutes.
[env:motion-test]
extends = env:waveshare-s3-rgb-matrix
build_flags =
    ${env:waveshare-s3-rgb-matrix.build_flags}
    -DMOTION_TEST
